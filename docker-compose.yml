# (removed obsolete `version` key: compose v2 warns on it every invocation)
services:
  postgres:
    image: postgres:16-alpine
    container_name: sales-agent-postgres
    environment:
      POSTGRES_DB: leads_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  pg-migrator:
    image: postgres:16-alpine
    container_name: sales-agent-pg-migrator
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./packages/api/database:/db
    entrypoint: ["sh", "-c", "PGPASSWORD=postgres psql -h postgres -U postgres -c 'CREATE DATABASE n8n' 2>/dev/null || true; DATABASE_URL=postgresql://postgres:postgres@postgres:5432/leads_db sh /db/utils/apply_schema.sh"]

  redis:
    image: redis:7-alpine
    container_name: sales-agent-redis
    # Durability (Track 1): AOF everysec + named volume, so queued jobs, DLQs,
    # circuit-breaker state and daily-claim keys survive restarts (RPO <= 1s).
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./packages/api
      dockerfile: Dockerfile
    container_name: sales-agent-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/leads_db
      REDIS_URL: redis://redis:6379
      HOST: 0.0.0.0
      WORKERS_URL: http://workers:8000
      WORKER_API_SECRET: ${WORKER_API_SECRET}
      # Trusted reverse proxy (web nginx) forwards X-Forwarded-For; trust it so
      # req.ip / rate-limiting see the real client IP (server.ts TRUST_PROXY).
      TRUST_PROXY: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # Loopback only. Everything that needs the API reaches it over the compose
      # network (web -> nginx -> api); publishing 3000 on 0.0.0.0 exposed the API
      # -- including /metrics and every unauthenticated endpoint -- on every host
      # interface, bypassing the reverse proxy entirely.
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  web:
    build:
      context: ./packages/web
      dockerfile: Dockerfile
    container_name: sales-agent-web
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

  workers:
    build:
      context: ./packages/scrapers
      dockerfile: Dockerfile
    container_name: sales-agent-workers
    env_file:
      - .env
    environment:
      WORKER_API_SECRET: ${WORKER_API_SECRET}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/leads_db
      REDIS_URL: redis://redis:6379
      REACHER_URL: http://reacher:3000
      # primp/rustls (ddgs search engines) does not reliably fall back to the
      # OS trust store on slim images: point it at the system bundle explicitly,
      # else OSINT search engines fail with "invalid peer certificate".
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      SSL_CERT_DIR: /etc/ssl/certs
    # Pin resolvers: Docker's embedded 127.0.0.11 forwards to whatever the
    # host uses (here, an IPv6 nameserver on a dead route) — that made MX and
    # search-engine lookups flap. Public resolvers keep it deterministic.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - postgres
      - redis
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    # NOTE: there is deliberately NO bind mount of ./packages/scrapers here.
    # It used to mount the source tree over the image's /app, which means the
    # production container ran whatever happened to be on the host filesystem --
    # an uncommitted edit, a stray .pyc, or a half-finished refactor -- instead of
    # the reviewed artifact baked into the image. Use docker-compose.dev.yml
    # (`docker compose -f docker-compose.yml -f docker-compose.dev.yml up`) when
    # you want live-reload while developing.

  reacher:
    # Digest pin (unpinned :latest meant an upstream release could silently change
    # the verifier's behaviour, or its response contract, on any redeploy).
    image: reacherhq/check-if-email-exists@sha256:0c38855658952b92e6d5300c79c5578b0a1f81bab8eacb3693fdd15a9b74a017
    container_name: sales-agent-reacher
    # The embedded Docker resolver forwards to host upstreams (incl. a dead
    # IPv6 one); Reacher's Rust resolver could not resolve any MX host through
    # it ("could not resolve address (... 25)"), degrading EVERY verification
    # to unknown. Explicit public resolvers fix MX resolution.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "127.0.0.1:5050:3000"
    restart: unless-stopped

  n8n:
    # Version + digest pin: a floating :latest means an unattended redeploy can
    # change the automation engine under you. 2.39.8 is the version this stack was
    # verified against.
    image: n8nio/n8n:2.39.8@sha256:b73045abaddb40cb4024e86eea1b1f69093501a7339f685a4cd486b7743d23ae
    container_name: sales-agent-n8n
    environment:
      # The previous N8N_BASIC_AUTH_ACTIVE / _USER / _PASSWORD block did NOTHING:
      # n8n removed HTTP basic auth in 1.0, and this image is 2.x, so those vars
      # were ignored and the editor (plus its REST API, which can execute
      # workflows) was reachable with NO credential on 127.0.0.1:5678. The only
      # trace of "protection" was a misleading `admin123` fallback password.
      # n8n >= 2.17.0 can pre-provision the instance owner instead, and it fails
      # CLOSED on BOTH vars: with MANAGED_BY_ENV=true and an empty email or hash
      # the container exits ("N8N_INSTANCE_OWNER_EMAIL is required...") instead of
      # coming up unauthenticated. Both exits verified against n8nio/n8n:2.39.8.
      # Generate the hash with:
      #   node -e "console.log(require('bcryptjs').hashSync(process.argv[1],12))" 'YOUR-PASSWORD'
      - N8N_INSTANCE_OWNER_MANAGED_BY_ENV=true
      - N8N_INSTANCE_OWNER_EMAIL=${N8N_OWNER_EMAIL:-}
      - N8N_INSTANCE_OWNER_FIRST_NAME=${N8N_OWNER_FIRST_NAME:-Admin}
      - N8N_INSTANCE_OWNER_LAST_NAME=${N8N_OWNER_LAST_NAME:-User}
      - N8N_INSTANCE_OWNER_PASSWORD_HASH=${N8N_OWNER_PASSWORD_HASH:-}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=postgres
      - DB_POSTGRESDB_PASSWORD=postgres
      - VOLS_PATH=/tmp/n8n-data
      - N8N_PORT=5678
      - N8N_HOST=0.0.0.0
    ports:
      - "127.0.0.1:5678:5678"
    depends_on:
      - postgres
    volumes:
      - n8n-data:/home/node/.n8n
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  n8n-data:
