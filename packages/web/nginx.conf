server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Production security headers. Cloudflare passes these through untouched,
    # so they are correct both behind Cloudflare and standalone.
    # NOTE: nginx `add_header` does not inherit into a location block that sets
    # its own add_header — the Cache-Control locations below repeat these.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # HSTS only when served over TLS (Cloudflare terminates TLS in front of this
    # container). Keep commented for plain-HTTP local dev: sending HSTS over HTTP
    # is ignored at best and a footgun at worst.
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    # Minimal CSP for this SPA: fully self-origin (fonts are bundled via
    # @fontsource-variable/inter, no third-party font hosts); images allow
    # data: + https: (company logos on arbitrary domains); style-src needs
    # 'unsafe-inline' (Tailwind runtime utilities + Vite). script-src has NO
    # 'unsafe-inline' / 'unsafe-eval'. connect-src 'self' covers the same-origin
    # REST API and the SSE stream behind the same origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Docker embedded DNS with a short TTL: upstream container IPs change on
    # recreate, and nginx resolves names only once at startup by default (a
    # stale `api` IP 502s the whole app after any api redeploy). Variables
    # force re-resolution per request.
    resolver 127.0.0.11 valid=10s;
    set $api_upstream api;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Entry HTML must never be cached: chunk filenames change per deploy and
    # a cached index.html pins the browser to the previous release's bundles
    # (stale UI after deploys with no errors anywhere).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    }

    # Hashed build assets are content-addressed: cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; frame-ancestors 'self'; base-uri 'self'" always;
    }

    location /api {
        proxy_pass http://$api_upstream:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The API trusts this proxy (TRUST_PROXY=true in docker-compose) so
        # req.ip / rate-limiting see the real client IP, not the nginx hop.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Lead imports POST a chunk of parsed CSV as JSON. nginx's 1 MB default rejected
        # the body with 413 before Fastify ever saw it, so large imports failed only when
        # served through this proxy and worked against the API directly. Kept in step with
        # API_BODY_LIMIT_BYTES (8 MB) in packages/api.
        client_max_body_size 10m;
        client_body_buffer_size 256k;
        # A bulk import is one long request; the default 60s read timeout aborted them.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Server-sent events (live lead updates). The API serves these under /api;
    # the client calls them relatively as /sse/*, so the prefix is re-attached
    # here. Buffering MUST stay off or the stream stalls.
    location /sse {
        proxy_pass http://$api_upstream:3000/api/sse;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
    }

    location /ws {
        proxy_pass http://$api_upstream:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
